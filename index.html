<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d31">
<title>広島市キャスト情報</title>
<style>
:root{color-scheme:dark;--bg:#0c1714;--panel:#172721;--line:#2d443b;--green:#a5e2bd;--muted:#a9b9b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
header{background:#123d31;padding:22px 16px 18px;border-bottom:1px solid #315849}h1{font-size:22px;margin:0 0 7px}header p{margin:0;color:#d2e6db;font-size:12px;line-height:1.6}
main{max-width:760px;margin:auto;padding:14px}.notice{background:#302a18;border:1px solid #62522b;border-radius:12px;padding:12px;font-size:12px;line-height:1.65;color:#f5e9c7;margin-bottom:14px}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}input,select{min-width:0;background:var(--panel);border:1px solid var(--line);color:white;border-radius:10px;padding:12px;font-size:15px}
.meta{color:var(--muted);font-size:12px;margin:8px 2px 12px}.list{display:grid;gap:9px}
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}
.rank{font-size:18px;font-weight:800;color:var(--green);text-align:center}.name{font-weight:700;font-size:15px;line-height:1.4;overflow-wrap:anywhere}.sub{font-size:11px;color:var(--muted);margin-top:5px}.count{font-size:12px;color:var(--green);white-space:nowrap;text-align:right}
a{color:#a5e2bd;text-decoration:underline;text-underline-offset:3px}.source{font-size:12px;margin-top:16px;line-height:1.9;color:var(--muted)}footer{padding:22px 0 35px;text-align:center;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<header><h1>広島市キャスト情報</h1><p>公開情報をもとにした候補一覧・比較用ページ</p></header>
<main>
<div class="notice">この一覧は特定の比較ページに掲載された候補情報です。広島市全体の公式人気ランキングではありません。表示件数は掲載元の表示値で、本人の実績や人気を保証するものではありません。写真・本人確認済みXアカウントは、確認できたものだけ掲載します。</div>
<div class="controls"><input id="q" type="search" placeholder="キャスト名で検索" aria-label="キャスト名で検索"><select id="sort" aria-label="並び替え"><option value="count">掲載件数順</option><option value="name">名前順</option></select></div>
<div class="meta" id="meta" aria-live="polite"></div><section class="list" id="list"></section>
<div class="source">掲載元：<a href="https://cvnk.jp/hiroshima/hiroshima-city/delivery-health" target="_blank" rel="noopener">広島市デリヘル比較ページ</a><br>個別プロフィール・店舗所属・写真・Xアカウントは未確認のものを推測で補っていません。</div>
<footer>公開情報の確認日：2026年11月12日</footer>
</main>
<script>
const entries=[
["カガミ～それいけ！加賀美さん～",152],
["ーサアヤー",104],
["ーメイー",99],
["ルリア～超絶ドMな未経験妻～",89],
["ーブルマー",84],
["ーミウー",60],
["ーユノハー",59],
["ジュン～奇跡の煽情的Iカップ～",53],
["マナミ",51],
["マーコ",46],
["ーソノー",41],
["ーアンPlatinumー",39],
["エミリ",38],
["サクラコ",33],
["アンナ",31],
["ーユリー",30]
];
const list=document.getElementById('list'),q=document.getElementById('q'),sort=document.getElementById('sort'),meta=document.getElementById('meta');
function render(){let rows=entries.filter(x=>x[0].toLowerCase().includes(q.value.trim().toLowerCase()));rows.sort((a,b)=>sort.value==='name'?a[0].localeCompare(b[0],'ja'):b[1]-a[1]);meta.textContent=rows.length+'名を表示（掲載候補 '+entries.length+'名）';list.replaceChildren();rows.forEach((x,i)=>{const el=document.createElement('article');el.className='item';const rank=document.createElement('div');rank.className='rank';rank.textContent=String(i+1).padStart(2,'0');const info=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=x[0];const sub=document.createElement('div');sub.className='sub';sub.textContent='店舗・本人プロフィール・写真・X：未確認';info.append(name,sub);const count=document.createElement('div');count.className='count';count.textContent='掲載表示 '+x[1];el.append(rank,info,count);list.append(el);});}
q.addEventListener('input',render);sort.addEventListener('change',render);render();
</script>
</body></html>
