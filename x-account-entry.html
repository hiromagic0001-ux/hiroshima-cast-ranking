<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123d31"><title>Xアカウント紐付け｜広島キャスト検索</title>
<style>
:root{color-scheme:dark;--bg:#0c1714;--panel:#172721;--line:#2d443b;--green:#a5e2bd;--muted:#a9b9b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
header{background:#123d31;padding:18px 16px;border-bottom:1px solid #315849}h1{font-size:20px;margin:0 0 6px}header p{font-size:12px;color:#d2e6db;margin:0}
main{max-width:760px;margin:auto;padding:14px}.note{background:#302a18;border:1px solid #62522b;border-radius:10px;padding:11px;font-size:12px;line-height:1.6;margin-bottom:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;margin:9px 0}.store{font-size:11px;color:var(--muted)}.cast{font-size:16px;font-weight:700;margin:3px 0 7px}.account{font-size:12px;overflow-wrap:anywhere}.account a{color:var(--green)}.status{font-size:11px;color:#c7d8ce;margin-top:7px}
.back{color:var(--green);font-size:12px}footer{font-size:11px;color:var(--muted);padding:20px 0}
</style></head><body>
<header><h1>Xアカウント紐付け</h1><p>広島キャスト検索｜ユーザー確認済みの対応情報</p></header>
<main><p><a class="back" href="/">← 広島キャスト検索へ戻る</a></p>
<div class="note">本人アカウントとして登録する確認済み情報です。URLの削除指定は反映対象から除外しています。未確定の候補は誤登録防止のため掲載していません。</div>
<div id="list"></div><footer>登録データはGitHubのアプリリポジトリで管理。確認済みの対応のみ掲載。</footer></main>
<script>
const records=[
{store:"Vivienne",cast:"美波",url:"https://x.com/vivienne_minami?s=11"},
{store:"Lavie & spa",cast:"さわ",url:"https://x.com/sawa_laviespa?s=11"},
{store:"Lavie＆Spa",cast:"いちか",url:"https://x.com/ichikatanlavie?s=11",instagram:"ichika_lav"},
{store:"Lavie＆Spa",cast:"らな",url:"https://x.com/lavie__rana4?s=11"},
{store:"Lavie＆Spa（ラヴィアンドスパ）",cast:"はづき",url:"https://x.com/q4ba67ewak33529?s=11"},
{store:"広島メンズエステ La Paix",cast:"らぺ",url:"https://x.com/paix_la72927?s=11"},
{store:"広島メンズエステ La Paix",cast:"ふじ香",url:"https://x.com/fujikalapaix?s=11"},
{store:"La Paix",cast:"世莉（ラペ）",account:"Lapaix_Seri",url:"https://x.com/s7l5t15?s=11"}
];
const list=document.getElementById("list");
records.forEach((r,i)=>{const el=document.createElement("section");el.className="item";
const store=document.createElement("div");store.className="store";store.textContent=r.store;
const cast=document.createElement("div");cast.className="cast";cast.textContent=r.cast;
const a=document.createElement("a");a.href=r.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=r.url;
const line=document.createElement("div");line.className="account";line.append("X：",a);
if(r.account){const ac=document.createElement("div");ac.className="status";ac.textContent="アカウント表示名："+r.account;el.append(store,cast,line,ac);}
else el.append(store,cast,line);
if(r.instagram){const ig=document.createElement("div");ig.className="status";ig.textContent="Instagram："+r.instagram;el.append(ig);}
const status=document.createElement("div");status.className="status";status.textContent="確認済み・登録対象";el.append(status);list.append(el);
});
</script></body></html>
