<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d31"><title>Xアカウント紐付け登録｜広島キャスト検索</title>
<style>
:root{color-scheme:dark;--bg:#0c1714;--panel:#172721;--line:#385447;--green:#a5e2bd;--muted:#a9b9b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{max-width:680px;margin:auto;padding:22px 15px 40px}h1{font-size:22px;margin:0 0 8px}p{font-size:13px;line-height:1.7;color:#c5d7cd}.note{background:#302a18;border:1px solid #62522b;border-radius:10px;padding:11px;color:#f5e9c7}.entry,.saved{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin:12px 0}.entry label{display:block;font-size:12px;color:var(--muted);margin:8px 0 5px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0c1714;color:white;font-size:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}button,.back{border:0;border-radius:9px;padding:13px;background:var(--green);color:#10251b;font-weight:800;font-size:14px;text-align:center;text-decoration:none;cursor:pointer}.secondary{background:#253a30;color:#e9f4ed;border:1px solid #496454}.danger{background:#492c2c;color:#ffdede;border:1px solid #754848}.saved strong{display:block;font-size:15px}.saved a{color:var(--green);overflow-wrap:anywhere;font-size:12px}.meta{font-size:12px;color:var(--muted)}#status{font-size:13px;color:var(--green);min-height:22px;white-space:pre-wrap}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.top a{color:var(--green);font-size:12px}
</style></head><body><main>
<div class="top"><a href="/">← サービス選択へ戻る</a><span class="meta">広島キャスト検索</span></div>
<h1>Xアカウント・キャスト紐付け</h1>
<p>店舗名・キャスト名・XアカウントURLを登録できます。今後の追加登録にも使えます。</p>
<div class="note">保存先はサーバー共通データです。登録したアカウントは後から店舗名・キャスト名・URLを修正または削除できます。現在は仮登録を優先し、後日確認して誤りがあれば修正してください。</div>
<div id="forms"></div>
<div class="actions"><button class="secondary" id="add">＋ 入力欄を追加</button><button id="save">入力内容を保存</button></div>
<div id="status" role="status"></div>
<h2 style="font-size:17px;margin-top:26px">保存済みアカウント</h2><div id="saved"></div>
<div class="actions"><button class="secondary" id="export">登録データをコピー</button><button class="danger" id="clear">全データを消去</button></div>
</main><script>
(()=> {
 const API="https://hiroshima-cast-refresh-api.onrender.com/api/storage/data/x_account_links";
 const forms=document.getElementById("forms"),saved=document.getElementById("saved"),status=document.getElementById("status");
 let rows=[]; let serverReady=false;
 const initialEntries=[
 {industry:"メンズエステ",store:"サロンドニーナ",cast:"峰城",url:"https://x.com/salondo_m",status:"本人未確認"},
 {industry:"メンズエステ",store:"サロンドニーナ",cast:"未来（みらい）",url:"https://x.com/mirai__nina",status:"本人未確認"},
 {industry:"メンズエステ",store:"BODY spa Hiroshima",cast:"天使（あまつか）",url:"https://x.com/xamatsuka_2x",status:"本人未確認"},
 {industry:"メンズエステ",store:"Vivienne",cast:"ひな",url:"https://x.com/hinachansab",status:"本人未確認"},
 {industry:"メンズエステ",store:"Lavie＆Spa",cast:"早坂みゆう",url:"https://x.com/miyuu_salon",status:"本人未確認"},
 {industry:"メンズエステ",store:"サロンドニーナ",cast:"矢吹",url:"https://x.com/salondonina_y",status:"本人未確認"},
 {industry:"メンズエステ",store:"アガットテイク",cast:"花澤メイ",url:"https://x.com/agatetakemay",status:"本人未確認"},
 {industry:"メンズエステ",store:"ゆりかご広島",cast:"麗華",url:"https://x.com/reikayurikago",status:"本人未確認"},
 {industry:"メンズエステ",store:"7DREAM Este",cast:"奏もも",url:"https://x.com/7dreammomo",status:"本人未確認"},
 {industry:"メンズエステ",store:"Vivienne",cast:"美波",url:"https://x.com/vivienne_minami",status:"本人未確認"},
 {industry:"メンズエステ",store:"Lavie＆Spa",cast:"さわ",url:"https://x.com/sawa_laviespa",status:"本人未確認"},
 {industry:"メンズエステ",store:"Lavie＆Spa",cast:"いちか",url:"https://x.com/ichikatanlavie",status:"本人未確認",instagram:"ichika_lav"},
 {industry:"メンズエステ",store:"Lavie＆Spa",cast:"らな",url:"https://x.com/lavie__rana4",status:"本人未確認",alternateUrls:["https://x.com/lavie__rana3"]},
 {industry:"メンズエステ",store:"広島メンズエステ La Paix",cast:"らぺ",url:"https://x.com/paix_la72927",status:"本人未確認"},
 {industry:"メンズエステ",store:"Queen",cast:"こころ",url:"https://x.com/queen_kokoro2",status:"本人未確認"},
 {industry:"メンズエステ",store:"Lavie＆Spa（ラヴィアンドスパ）",cast:"はづき",url:"https://x.com/q4ba67ewak33529",status:"本人未確認"},
 {industry:"メンズエステ",store:"Lavie＆Spa",cast:"めい",url:"https://x.com/mei_l_s",status:"本人未確認"},
 {industry:"メンズエステ",store:"広島メンズエステ La Paix",cast:"ふじ香",url:"https://x.com/fujikalapaix",status:"本人未確認"},
 {industry:"メンズエステ",store:"La Paix",cast:"世莉（ラペ）",url:"https://x.com/s7l5t15",status:"本人未確認",accountName:"Lapaix_Seri"},
 {industry:"メンズエステ",store:"natural",cast:"はな",url:"https://x.com/natural_87_hana",status:"本人未確認"},
 {industry:"メンズエステ",store:"natural",cast:"もね",url:"https://x.com/natural_mone",status:"本人未確認"},
 {industry:"メンズエステ",store:"natural",cast:"もね",url:"https://x.com/mone_natural",status:"本人未確認"},
 {industry:"メンズエステ",store:"natural",cast:"ななせ",url:"https://x.com/mone_natural",status:"本人未確認"},
 {industry:"メンズエステ",store:"natural",cast:"みお",url:"https://x.com/mio4859",status:"本人未確認"}
 ];
 const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 function addRow(v={}){const el=document.createElement("section");el.className="entry";el.innerHTML='<label>業種</label><select data-k="industry" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0c1714;color:white;font-size:15px"><option value="メンズエステ">メンズエステ</option><option value="デリヘル">デリヘル</option><option value="ソープランド">ソープランド</option></select><label>店舗名</label><input data-k="store" placeholder="例：サロンドニーナ" value="'+esc(v.store)+'"><label>キャスト名</label><input data-k="cast" placeholder="例：〇〇" value="'+esc(v.cast)+'"><label>XアカウントURL</label><input data-k="url" type="url" inputmode="url" placeholder="https://x.com/アカウント名" value="'+esc(v.url)+'"><div class="actions"><button type="button" class="danger remove">この入力欄を削除</button><span></span></div>';el.querySelector("[data-k=status]").value=status;el.querySelector('[data-k="industry"]').value=v.industry||"メンズエステ";el.querySelector(".remove").onclick=()=>el.remove();forms.append(el)}
 function render(){saved.innerHTML=rows.length?rows.map((r,i)=>'<div class="saved"><strong>'+(i+1)+'. '+esc(r.industry||"メンズエステ")+'｜'+esc(r.store)+'｜'+esc(r.cast)+'</strong><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.url)+'</a></div>').join(""):'<p class="meta">まだ登録されていません。</p>'}
 function payloadOf(data){if(Array.isArray(data))return data;for(const k of ["data","value","records","items"])if(Array.isArray(data?.[k]))return data[k];if(Array.isArray(data?.result))return data.result;return []}
 async function load(){
 status.textContent="サーバーから登録データを読み込み中…";
 try{
  const res=await fetch(API,{method:"GET",cache:"no-store"});
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||("HTTP "+res.status));
  rows=payloadOf(data);serverReady=true;
  const rowKey=r=>[r.store||"",r.cast||"",String(r.url||"").replace(/\\?.*$/,"").replace(/\\/$/,"").toLowerCase()].join("|").toLowerCase();
  const merged=new Map(rows.map(r=>[rowKey(r),r]));
  let added=0;
  initialEntries.forEach(r=>{const key=rowKey(r);if(!merged.has(key)){merged.set(key,r);added++}});
  if(added){
   const next=[...merged.values()];
   const put=await fetch(API,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(next)});
   const savedData=await put.json();
   if(!put.ok)throw new Error(savedData.error||("HTTP "+put.status));
   rows=next;
   status.textContent="確認対象アカウントをサーバーへ仮登録しました（新規"+added+"件／合計"+rows.length+"件）。後日、誤りがあれば修正できます。";
  }else status.textContent="サーバー登録済みです（"+rows.length+"件）。";
 }catch(e){serverReady=false;if(!rows.length)rows=initialEntries.slice();status.textContent="サーバーへの保存は未確認です。入力内容はこの画面に表示しています。接続復旧後に再読み込みして保存状況を確認してください。\\n"+(e.message||e)}
 forms.innerHTML="";if(rows.length)rows.forEach(addRow);else addRow();render();
 }
 document.getElementById("add").onclick=()=>addRow();
 document.getElementById("save").onclick=async()=>{if(!serverReady){status.textContent="サーバーに接続できていないため保存できません。ページを再読み込みしてください。";return}
 const inputRows=[...forms.querySelectorAll(".entry")].map(el=>Object.fromEntries([...el.querySelectorAll("input,select")].map(i=>[i.dataset.k,i.value.trim()]))).filter(r=>r.store||r.cast||r.url);
 const invalid=inputRows.find(r=>!r.store||!r.cast||!/^https:\/\/(www\.)?x\.com\//i.test(r.url));
 if(invalid){status.textContent="店舗名・キャスト名・X URLをすべて入力してください。URLは https://x.com/ から始めてください。";return}
 const rowKey=r=>[r.store||"",r.cast||"",String(r.url||"").toLowerCase()].join("|").toLowerCase();const merged=new Map(rows.map(r=>[rowKey(r),r]));inputRows.forEach(r=>merged.set(rowKey(r),r));const next=[...merged.values()];
 status.textContent="サーバーへ保存中…";
 try{const res=await fetch(API,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(next)});const data=await res.json();if(!res.ok)throw new Error(data.error||("HTTP "+res.status));rows=next;render();status.textContent="サーバーへの保存が完了しました（"+rows.length+"件）。別の端末からも読み込めます。"}
 catch(e){status.textContent="サーバー保存に失敗しました。データは確定保存されていません。\n"+(e.message||e)}
 };
 document.getElementById("export").onclick=async()=>{const data=JSON.stringify(rows,null,2);try{await navigator.clipboard.writeText(data);status.textContent="サーバー登録データをコピーしました。"}catch{status.textContent=data}};
 document.getElementById("clear").onclick=async()=>{if(!confirm("サーバー上のX紐付けデータをすべて消去しますか？"))return;try{const res=await fetch(API,{method:"PUT",headers:{"Content-Type":"application/json"},body:"[]"});const data=await res.json();if(!res.ok)throw new Error(data.error||("HTTP "+res.status));rows=[];render();status.textContent="サーバー上のデータを消去しました。"}catch(e){status.textContent="消去に失敗しました。\n"+(e.message||e)}};
 load();
})();
</script></body></html>
